name: Build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Fast sanity check on every push/PR to main: typecheck + renderer/main
  # bundle only, no electron-builder packaging. Keeps normal commits cheap.
  sanity:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npx vite build

  # Full cross-platform installer build, only on version tags (releases).
  package:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build-script: build:linux
          - os: macos-latest
            build-script: build:mac
          - os: windows-latest
            build-script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - run: npm run ${{ matrix.build-script }}

      - uses: actions/upload-artifact@v7
        with:
          name: paper-digital-converter-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  # Publishes a public GitHub Release with the built installers once every
  # platform in the matrix above has succeeded. Kept separate from
  # electron-builder's own --publish (disabled, see build scripts) since that
  # crashes in CI without further config.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
