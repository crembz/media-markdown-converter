<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- media card: play badge + waveform, representing mixed audio/document input -->
  <g transform="translate(210,190)">
    <rect width="430" height="590" rx="28" fill="#f5e0dc"/>

    <circle cx="215" cy="150" r="92" fill="url(#accent)"/>
    <path d="M182 103 L182 197 L266 150 Z" fill="#1e1e2e"/>

    <rect x="75" y="450" width="30" height="90" rx="15" fill="#9399b2"/>
    <rect x="123" y="390" width="30" height="150" rx="15" fill="#9399b2"/>
    <rect x="171" y="330" width="30" height="210" rx="15" fill="#9399b2"/>
    <rect x="219" y="410" width="30" height="130" rx="15" fill="#9399b2"/>
    <rect x="267" y="300" width="30" height="240" rx="15" fill="#9399b2"/>
    <rect x="315" y="370" width="30" height="170" rx="15" fill="#9399b2"/>
    <rect x="363" y="440" width="30" height="100" rx="15" fill="#9399b2"/>
  </g>

  <!-- arrow -->
  <path d="M470 512 h130" stroke="url(#accent)" stroke-width="34" stroke-linecap="round"/>
  <path d="M555 445 l90 67 l-90 67" fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- markdown card -->
  <g transform="translate(640,300)">
    <rect width="290" height="420" rx="36" fill="url(#accent)"/>
    <text x="145" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="700" fill="#1e1e2e" text-anchor="middle">M</text>
  </g>
</svg>
