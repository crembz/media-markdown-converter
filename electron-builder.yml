appId: com.mediamarkdownconverter.app
productName: Media Markdown Converter
directories:
  output: dist
files:
  - dist-electron/**
  - dist/**
  - node_modules/ffmpeg-static/**
# The ffmpeg binary can't run from inside app.asar — unpack it so it stays a
# real file on disk at node_modules/ffmpeg-static/ffmpeg (ffmpeg-static's own
# path resolution already expects this asar/asar.unpacked split).
asarUnpack:
  - node_modules/ffmpeg-static/**
icon: build/icon.png

win:
  icon: build/icon.png
  target: nsis
nsis:
  oneClick: false

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
    - zip

linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage
    - deb
